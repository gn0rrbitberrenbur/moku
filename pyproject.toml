[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pymoku"
dynamic = ["version"]
description = "Python bindings for the moku engine"
readme = "python_bindings/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy<2.5"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
wheel.packages = ["python_bindings/pymoku"]

[tool.scikit-build.cmake.define]
MOKU_BUILD_PYTHON = "ON"
MOKU_BUILD_ENGINE = "OFF"
MOKU_BUILD_TESTS = "OFF"
MOKU_BUILD_NNUE = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\d+\.\d+\.\d+)'

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["pp*"]
test-requires = ["numpy", "pytest"]
test-command = "pytest {project}/bindings/python/tests/test_pymoku.py -q"