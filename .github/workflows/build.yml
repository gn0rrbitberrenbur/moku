name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOKU_BUILD_ENGINE=ON \
            -DMOKU_BUILD_TESTS=OFF \
            -DMOKU_BUILD_PYTHON=OFF \
            -DMOKU_BUILD_NNUE=OFF \
            -DMOKU_BUILD_CLI=OFF

      - name: Build engine targets
        shell: bash
        run: |
          cmake --build build --config Release --target gomocup_moku extended_moku

      - name: Prepare Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/gomocup_moku "release/gomocup_moku_${version}"
          cp build/extended_moku "release/extended_moku_${version}"

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "build/Release/gomocup_moku.exe" "release/gomocup_moku_${version}.exe"
          Copy-Item "build/Release/extended_moku.exe" "release/extended_moku_${version}.exe"

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: moku-linux
          path: release/*

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: moku-windows
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/moku-linux/*
            artifacts/moku-windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}